name: rika_ecomm_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  persistent_bottom_nav_bar: ^6.2.1
  timeline_tile: ^2.0.0
  buttons_tabbar: ^1.3.13
  dio: ^5.7.0
  provider: ^6.1.2
  json_annotation: ^4.9.0
  loading_overlay: ^0.4.2
  flutter_bloc: ^9.0.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5
  dotted_border: ^2.0.0
  flutter_swipe_action_cell: ^3.1.5
  intl: ^0.20.1
  flutter_image_compress: ^2.1.0
  flutter_spinkit: ^5.2.0
  carousel_slider: ^5.0.0
    #pagination
  pull_to_refresh: ^2.0.0

 


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/3x/
    - assets/images/2x/
    - assets/images/

  fonts:
    - family: Mont_Blanc_Black
      fonts:
         - asset: assets/fonts/Mont_Blanc_Black.otf
    - family: Mont_Blanc_Regular
      fonts:
         - asset: assets/fonts/Mont_Blanc_Regular.otf
    - family: Mont_Blanc_Bold
      fonts:        
         - asset: assets/fonts/Mont_Blanc_Bold.otf
    - family: Mont_Blanc_Light
      fonts:        
         - asset: assets/fonts/Mont_Blanc_Light.otf
